name: Build Windows Usage Tray

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-usage-tray.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-usage-tray.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test, build and smoke-test executable
        shell: powershell
        run: ./windows/build.ps1
      - name: Test packaged calculation foundation
        shell: powershell
        run: |
          ./windows/.venv/Scripts/python.exe windows/tests/packaged_credit_foundation.py --exe windows/dist/UsageTray.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged calculation foundation regression failed." }
      - name: Test dashboard interactions and packaged launchers
        shell: powershell
        run: |
          node --test windows/dashboard/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Dashboard interaction tests failed." }
          ./windows/.venv/Scripts/python.exe windows/tests/packaged_dashboard_smoke.py --exe windows/dist/UsageTray.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged dashboard smoke failed." }
          ./windows/.venv/Scripts/python.exe windows/tests/packaged_local_hub_smoke.py --exe windows/dist/UsageTray.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged local hub smoke failed." }
          ./windows/.venv/Scripts/python.exe windows/tests/packaged_codex_fork_smoke.py --exe windows/dist/UsageTray.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged Codex fork regression failed." }
          ./windows/.venv/Scripts/python.exe windows/tests/packaged_hub_release.py --exe windows/dist/UsageTray.exe --measurements windows/build/hub-release-measurements.json
          if ($LASTEXITCODE -ne 0) { throw "Packaged hub release acceptance failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: UsageTray-Windows-Python-${{ matrix.python }}
          path: |
            windows/dist/UsageTray.exe
            windows/dist/UsageTraySetup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: UsageHub-release-measurements-Python-${{ matrix.python }}
          path: windows/build/hub-release-measurements.json
          if-no-files-found: error
