name: Build Windows Usage Tray

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-usage-tray.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-usage-tray.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test, build and smoke-test executable
        shell: powershell
        run: ./windows/build.ps1
      - name: Test existing dashboard interactions and packaged preview
        shell: powershell
        run: |
          node --test windows/dashboard/tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Dashboard interaction tests failed." }
          ./windows/.venv/Scripts/python.exe windows/tests/packaged_dashboard_smoke.py --exe windows/dist/UsageTray.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged dashboard smoke failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: UsageTray-Windows-Python-${{ matrix.python }}
          path: windows/dist/UsageTray.exe
          if-no-files-found: error
